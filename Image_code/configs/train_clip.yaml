project: "image_vad"
entity: ""         # optional: your wandb team
run_name: "clip-vad"
wandb_mode: "online"   # "online" | "offline" | "disabled"

data:
  tsv_path: "../dataset/WikiArt-Emotions-Ag3.tsv"
  img_root: "../dataset/images"
  vad_lexicon_path: "../dataset/VAD_Lookup.txt"
  vad_dim: 3
  val_ratio: 0.1
  test_ratio: 0.1
  img_size: 224

train:
  epochs: 30 
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-4
  ccc_weight: 0.2
  amp: true  
  seed: 42
  dropout: 0.3          # Dropout in heads

model:
  type: "clip"                    # "resnet" | "clip" | "vit"
  backbone: "ViT-B/32"            # CLIP models: ViT-B/32, ViT-B/16, ViT-L/14, RN50
  emb_dim: 128
  freeze_encoder: true            # Freeze CLIP encoder, only train heads

logging:
  log_every_n_steps: 25
  save_dir: "outputs_clip"
  save_best_metric: "val/mse"

